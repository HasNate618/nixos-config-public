[general]
home_row_keys=
modes=tile,bisect
cancellation_status_code=0

[mode_tile]
label_color=#{{colors.on_surface.default.hex_stripped}}
label_select_color=#{{colors.on_surface.default.hex_stripped}}
unselectable_bg_color=#{{colors.surface.default.hex_stripped}}00
selectable_bg_color=#{{colors.surface.default.hex_stripped}}ee
selectable_border_color=#{{colors.primary.default.hex_stripped}}cc
label_font_family=JetBrains Mono
label_font_size=8 50% 100
label_symbols=abcdefghijklmnopqrstuvwxyz

[mode_floating]
source=stdin
label_color=#{{colors.on_surface.default.hex_stripped}}
label_select_color=#{{colors.on_surface.default.hex_stripped}}
unselectable_bg_color=#{{colors.surface.default.hex_stripped}}00
selectable_bg_color=#{{colors.surface.default.hex_stripped}}cc
selectable_border_color=#{{colors.primary.default.hex_stripped}}cc
label_font_family=JetBrains Mono
label_font_size=12 50% 100
label_symbols=abcdefghijklmnopqrstuvwxyz

[mode_bisect]
label_color=#{{colors.on_surface.default.hex_stripped}}
label_font_size=20
label_font_family=JetBrains Mono
label_padding=12
pointer_size=20
pointer_color=#{{colors.primary.default.hex_stripped}}cc
unselectable_bg_color=#{{colors.surface.default.hex_stripped}}00
even_area_bg_color=#{{colors.surface.default.hex_stripped}}ee
even_area_border_color=#{{colors.primary.default.hex_stripped}}88
odd_area_bg_color=#{{colors.surface.default.hex_stripped}}ee
odd_area_border_color=#{{colors.primary.default.hex_stripped}}88
history_border_color=#{{colors.outline.default.hex_stripped}}99

[mode_split]
pointer_size=20
pointer_color=#{{colors.primary.default.hex_stripped}}cc
bg_color=#{{colors.surface.default.hex_stripped}}00
area_bg_color=#{{colors.surface.default.hex_stripped}}ee
vertical_color=#{{colors.primary.default.hex_stripped}}cc
horizontal_color=#{{colors.tertiary.default.hex_stripped}}cc
history_border_color=#{{colors.outline.default.hex_stripped}}99

[mode_click]
button=left
