# Kanagawa Dragon — default focus-mode colour scheme.
#
# Terminal-style palette (foot-compatible key=value, hex without '#').
# Focus mode drives every surface from this file: wallpaper/background,
# quickshell bar + popups, foot terminals (alpha forced to 1.0), and the
# hyprlock screen. The quickshell slots are derived — inkDeep=regular7,
# sumi=bright0, indigo=bright4, seal=regular1 — and can be overridden with
# ui_* keys (this scheme pins indigo to kanagawa's dragonBlue, the value
# the shell shipped with before schemes existed).
#
# Switch schemes live:  focus-scheme gruvbox-dark
# List schemes:         focus-scheme

background=181616
foreground=c5c9c5

selection_background=2d4f67
selection_foreground=c8c093

regular0=0d0c0c
regular1=c4746e
regular2=8a9a7b
regular3=c4b28a
regular4=8ba4b0
regular5=a292a3
regular6=8ea4a2
regular7=c8c093

bright0=a6a69c
bright1=e46876
bright2=87a987
bright3=e6c384
bright4=7fb4ca
bright5=938aa9
bright6=7aa89f
bright7=c5c9c5

