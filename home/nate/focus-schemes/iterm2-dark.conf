# iTerm2 Dark Background — focus-mode colour scheme.
# Canonical palette: iTerm2-Color-Schemes (ghostty export, "iTerm2 Dark
# Background"). The plain "iTerm2 Default" variant differs only in the white
# slots and the blue (2225c4); this is the dark-background one.
# NOTE: this is a HIGH-CHROMA ANSI palette by design — bright red/green/blue
# at near-full saturation. The focus-mode accent ramp keeps it from spraying
# every hue at once, but expect it to be the most colourful scheme in the set.

background=000000
foreground=c7c7c7

selection_background=c1deff
selection_foreground=000000

regular0=000000
regular1=c91b00
regular2=00c200
regular3=c7c400
regular4=0225c7
regular5=ca30c7
regular6=00c5c7
regular7=c7c7c7

bright0=686868
bright1=ff6e67
bright2=5ffa68
bright3=fffc67
bright4=6871ff
bright5=ff77ff
bright6=60fdff
bright7=ffffff
