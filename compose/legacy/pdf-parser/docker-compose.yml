services:
  pdf-parser:
    build: .
    container_name: pdf-parser
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 100
    cap_drop:
      - ALL
    volumes:
      - /var/lib/docling:/data
    environment:
      - HF_HOME=/data/cache
      - DOCLING_DEVICE=cuda
      - VLM_PROVIDER=none
      - VLM_API_URL=
